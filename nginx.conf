server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version from response headers.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths must return index.html, not a 404,
    # or a deep link such as /reports/<id> would break on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, otherwise a stale document would
    # keep pointing at asset hashes that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
