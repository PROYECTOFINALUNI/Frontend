name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: expense-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves the app
        run: |
          docker run -d --name frontend -p 3000:3000 expense-frontend:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "Container is healthy."
              curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
              echo "index.html is served."
              exit 0
            fi
            sleep 2
          done
          echo "The container never became healthy." >&2
          docker logs frontend
          exit 1
